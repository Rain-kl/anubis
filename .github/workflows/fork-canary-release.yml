name: Fork canary release

# Every push to canary immediately publishes:
#  - docker image ghcr.io/<repo>:canary  (handled by docker.yml)
#  - a prerelease named canary-<short-sha> with cross-platform binaries
#
# Binary version (ldflags + filename) is the HEAD commit hash.

on:
  push:
    branches: ["canary"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Never cancel an in-flight release; a cancelled run can leave a
# half-uploaded prerelease behind.
concurrency:
  group: fork-canary-release
  cancel-in-progress: false

env:
  GO_VERSION: "stable"
  NODE_VERSION: "24.15.0"

jobs:
  # ──────────────────────────────────────────────
  # Job 0: Publish the canary container image
  # ──────────────────────────────────────────────
  docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      DOCKER_METADATA_SET_OUTPUT_ENV: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: ko-build/setup-ko@d006021bd0c28d1ce33a07e7943d48b079944c8d # v0.9

      - name: Log into registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=canary
            type=sha,format=short,prefix=canary-

      - name: Build and push
        env:
          DOCKER_REPO: ${{ env.IMAGE }}
          SLOG_LEVEL: debug
        run: |
          npm ci
          npm run container

  # ──────────────────────────────────────────────
  # Job 1: Build front-end assets once (platform independent)
  # ──────────────────────────────────────────────
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential brotli zstd

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          target: wasm32-unknown-unknown

      - name: Setup wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3

      - name: Install Node dependencies
        run: npm ci

      - name: Build front-end assets
        run: npm run assets

      - name: Upload assets artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: canary-assets
          path: |
            web/static/
            xess/xess.min.css
            lib/challenge/preact/static/app.js
          retention-days: 1

  # ──────────────────────────────────────────────
  # Job 2: Cross-compile Go binaries
  # ──────────────────────────────────────────────
  build-binary:
    needs: build-assets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download asset artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: canary-assets
          path: .

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go mod download

          VERSION="$(git rev-parse --short HEAD)"

          EXT=""
          if [ "$GOOS" = "windows" ]; then
            EXT=".exe"
          fi

          OUTPUT_NAME="anubis-${GOOS}-${GOARCH}-${VERSION}${EXT}"

          # -buildvcs=false keeps runtime/debug.BuildInfo from reporting a
          # module pseudo-version, which would otherwise override the -X value.
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X 'github.com/TecharoHQ/anubis.Version=${VERSION}'" \
            -o "${OUTPUT_NAME}" \
            ./cmd/anubis

          echo "OUTPUT_NAME=${OUTPUT_NAME}" >> "$GITHUB_ENV"

      - name: Upload binary artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: anubis-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.OUTPUT_NAME }}
          retention-days: 1

  # ──────────────────────────────────────────────
  # Job 3: Publish prerelease for this commit
  # ──────────────────────────────────────────────
  release:
    needs: build-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download all binary artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: anubis-*
          path: dist/
          merge-multiple: true

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="$(git rev-parse --short HEAD)"
          TAG="canary-${VERSION}"

          # Idempotent: a re-run of the same commit replaces the snapshot.
          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true

          cat > notes.md <<EOF
          Canary build of commit \`${GITHUB_SHA}\` on branch \`canary\`.

          Docker image: \`ghcr.io/${{ github.repository }}:canary\`

          Binary version: \`${VERSION}\`
          EOF

          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Canary ${VERSION}" \
            --notes-file notes.md \
            dist/*
